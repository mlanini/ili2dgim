<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ili2dgim Runner</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.body.innerHTML =
          '<main style="font-family: Segoe UI, sans-serif; max-width: 720px; margin: 3rem auto; padding: 1rem; line-height: 1.5;">' +
          "<h1>Avvio non valido</h1>" +
          "<p>Questa app non puo essere aperta direttamente come file locale.</p>" +
          "<p>Opzione A (Vite): avviala su <strong>http://127.0.0.1:5173</strong>.</p>" +
          "<pre style=\"background:#f3f4f6;padding:.75rem;border-radius:8px;overflow:auto;\">cd webapp\nnpm run dev</pre>" +
          "<p>Opzione B (no-build, no-npm): usa la UI statica servita dal backend su <strong>http://127.0.0.1:8000</strong>.</p>" +
          "<pre style=\"background:#f3f4f6;padding:.75rem;border-radius:8px;overflow:auto;\">python backend/run_local.py</pre>" +
          "</main>";
      } else {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/main.tsx";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
